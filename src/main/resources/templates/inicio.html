<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title th:text="${titulo}">Inicio</title>
</head>
<body>
    <header class="cabecera">
        <h1 th:text="${titulo}"></h1>
        <p>Pagina armada por SpringBoot a las <strong th:text="${hora}">00:00:00</strong></p>
    </header>
    <main class="tarjetas">
        <article class="tarjeta" th:each="lugar: ${lugares}">
            <span class="sector" th:text="${lugar.sector}">Sector</span>
            <h2 th:text="${lugar.nombre}">Nombre del lugar</h2>
            <p th:text="${lugar.descripcion}">Descripcion del lugar</p>
        </article>
    </main>
    <footer class="pie">SENA - ADSO - Ficha 3230489 - Luis Alonso Cely Arias</footer>
</body>
</html>
